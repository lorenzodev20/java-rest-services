server.port=8081
spring.application.name=api-libros

# =========================================
# CONFIGURACIÓN DE H2 DATABASE
# =========================================
spring.datasource.url=jdbc:h2:mem:db_biblioteca;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# =========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Crea y destruye las tablas automáticamente al iniciar/detener la app
spring.jpa.hibernate.ddl-auto=create-drop
# Muestra las consultas SQL ejecutadas en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Para que data.sql se ejecute después de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

# =========================================
# CONSOLA WEB DE H2
# =========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console